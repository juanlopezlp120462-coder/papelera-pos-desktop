name: Crear Update PAPELERA POS

on:
  push:
    tags:
      - "v*"

jobs:
  build-update:
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

        - name: Instalar Python
          uses: actions/setup-python@v5
          with:
            python-version: "3.14"

      - name: Instalar dependencias
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

          python -c "import dotenv; print('python-dotenv OK:', dotenv.__file__)"

      - name: Obtener version
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}".Replace("v","")

          "VERSION=$version" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host "VERSION DEL RELEASE" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "Tag: ${{ github.ref_name }}"
          Write-Host "Version: $version"
          Write-Host ""

      - name: Crear EXE con PyInstaller
        shell: powershell
        run: |
          python -m PyInstaller --clean PAPELERA_POS.spec

          if ($LASTEXITCODE -ne 0) {
              Write-Error "PyInstaller fallo."
              exit 1
          }

      - name: Verificar compilacion
        shell: powershell
        run: |
          $internal = "dist\PAPELERA_POS\_internal"
          $exe = "dist\PAPELERA_POS\PAPELERA_POS.exe"

          if (!(Test-Path -LiteralPath $exe)) {
              Write-Error "No existe PAPELERA_POS.exe"
              exit 1
          }

          if (!(Test-Path -LiteralPath $internal)) {
              Write-Error "No existe _internal"
              exit 1
          }

          Write-Host "EXE encontrado." -ForegroundColor Green
          Write-Host "_internal encontrado." -ForegroundColor Green

      - name: Verificar python-dotenv
        shell: powershell
        run: |
          $dotenv = "dist\PAPELERA_POS\_internal\dotenv"
          $init = "dist\PAPELERA_POS\_internal\dotenv\__init__.py"

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host "VERIFICANDO PYTHON-DOTENV" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host ""

          if (!(Test-Path -LiteralPath $dotenv)) {
              Write-Error "ERROR CRITICO: No existe la carpeta dotenv."
              Write-Host "Ruta esperada:"
              Write-Host $dotenv
              exit 1
          }

          if (!(Test-Path -LiteralPath $init)) {
              Write-Error "ERROR CRITICO: Falta dotenv\__init__.py."
              Write-Host "Ruta esperada:"
              Write-Host $init
              exit 1
          }

          Write-Host "dotenv encontrado correctamente." -ForegroundColor Green
          Write-Host "__init__.py encontrado correctamente." -ForegroundColor Green
          Write-Host ""

          Get-ChildItem -LiteralPath $dotenv

      - name: Verificar certifi
        shell: powershell
        run: |
          $cert = "dist\PAPELERA_POS\_internal\certifi\cacert.pem"

          if (!(Test-Path -LiteralPath $cert)) {
              Write-Error "ERROR: Falta certifi\cacert.pem"
              exit 1
          }

          Write-Host "certifi OK." -ForegroundColor Green

      - name: Crear version.txt
        shell: powershell
        run: |
          $rootVersion = "dist\PAPELERA_POS\version.txt"
          $internalVersion = "dist\PAPELERA_POS\_internal\version.txt"

          Set-Content `
            -LiteralPath $rootVersion `
            -Value $env:VERSION `
            -Encoding UTF8

          Set-Content `
            -LiteralPath $internalVersion `
            -Value $env:VERSION `
            -Encoding UTF8

          Write-Host "version.txt creado." -ForegroundColor Green

      - name: Verificar versiones
        shell: powershell
        run: |
          $rootVersion = (
              Get-Content `
                -LiteralPath "dist\PAPELERA_POS\version.txt" `
                -Raw
          ).Trim()

          $internalVersion = (
              Get-Content `
                -LiteralPath "dist\PAPELERA_POS\_internal\version.txt" `
                -Raw
          ).Trim()

          Write-Host ""
          Write-Host "Version raiz: $rootVersion"
          Write-Host "Version _internal: $internalVersion"
          Write-Host "Version esperada: $env:VERSION"
          Write-Host ""

          if ($rootVersion -ne $env:VERSION) {
              Write-Error "ERROR: version.txt de raiz incorrecto."
              exit 1
          }

          if ($internalVersion -ne $env:VERSION) {
              Write-Error "ERROR: version.txt de _internal incorrecto."
              exit 1
          }

          Write-Host "Versiones correctas." -ForegroundColor Green

      - name: Preparar carpeta update
        shell: powershell
        run: |
          if (Test-Path -LiteralPath "update") {
              Remove-Item `
                -LiteralPath "update" `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "update" `
            -Force | Out-Null

          Write-Host "Copiando PAPELERA_POS.exe..."

          Copy-Item `
            -LiteralPath "dist\PAPELERA_POS\PAPELERA_POS.exe" `
            -Destination "update\PAPELERA_POS.exe" `
            -Force

          Write-Host "Copiando version.txt..."

          Copy-Item `
            -LiteralPath "dist\PAPELERA_POS\version.txt" `
            -Destination "update\version.txt" `
            -Force

          Write-Host "Copiando _internal completo..."

          Copy-Item `
            -LiteralPath "dist\PAPELERA_POS\_internal" `
            -Destination "update\_internal" `
            -Recurse `
            -Force

          Write-Host ""
          Write-Host "Carpeta update preparada." -ForegroundColor Green

      - name: Verificar update
        shell: powershell
        run: |
          $exe = "update\PAPELERA_POS.exe"
          $version = "update\version.txt"
          $internal = "update\_internal"
          $dotenv = "update\_internal\dotenv\__init__.py"
          $cert = "update\_internal\certifi\cacert.pem"

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host "VERIFICANDO UPDATE" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host ""

          if (!(Test-Path -LiteralPath $exe)) {
              Write-Error "Falta update\PAPELERA_POS.exe"
              exit 1
          }

          if (!(Test-Path -LiteralPath $version)) {
              Write-Error "Falta update\version.txt"
              exit 1
          }

          if (!(Test-Path -LiteralPath $internal)) {
              Write-Error "Falta update\_internal"
              exit 1
          }

          if (!(Test-Path -LiteralPath $dotenv)) {
              Write-Error "ERROR CRITICO: Falta update\_internal\dotenv\__init__.py"
              exit 1
          }

          if (!(Test-Path -LiteralPath $cert)) {
              Write-Error "ERROR: Falta update\_internal\certifi\cacert.pem"
              exit 1
          }

          $updateVersion = (
              Get-Content `
                -LiteralPath $version `
                -Raw
          ).Trim()

          if ($updateVersion -ne $env:VERSION) {
              Write-Error "ERROR: version.txt del update incorrecto."
              exit 1
          }

          Write-Host "PAPELERA_POS.exe OK." -ForegroundColor Green
          Write-Host "version.txt OK." -ForegroundColor Green
          Write-Host "_internal OK." -ForegroundColor Green
          Write-Host "dotenv OK." -ForegroundColor Green
          Write-Host "certifi OK." -ForegroundColor Green
          Write-Host ""

      - name: Mostrar contenido de update
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host "CONTENIDO DE UPDATE" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host ""

          Get-ChildItem `
            -LiteralPath "update" `
            -Recurse `
            -File |
            Select-Object FullName, Length

      - name: Crear update.zip
        shell: powershell
        run: |
          if (Test-Path -LiteralPath "update.zip") {
              Remove-Item `
                -LiteralPath "update.zip" `
                -Force
          }

          Compress-Archive `
            -Path "update\*" `
            -DestinationPath "update.zip" `
            -CompressionLevel Optimal

          if (!(Test-Path -LiteralPath "update.zip")) {
              Write-Error "NO SE CREO update.zip"
              exit 1
          }

          Write-Host ""
          Write-Host "update.zip creado correctamente." -ForegroundColor Green

      - name: Verificar contenido del ZIP
        shell: powershell
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $zipPath = (Resolve-Path "update.zip").Path
          $zip = [System.IO.Compression.ZipFile]::OpenRead($zipPath)

          try {
              $names = @(
                  $zip.Entries |
                  ForEach-Object {
                      $_.FullName
                  }
              )

              Write-Host ""
              Write-Host "==========================================" -ForegroundColor Cyan
              Write-Host "CONTENIDO DEL ZIP" -ForegroundColor Cyan
              Write-Host "==========================================" -ForegroundColor Cyan
              Write-Host ""

              $names | Select-String "dotenv"

              $exeEntry = $names |
                  Where-Object {
                      $_ -match "^PAPELERA_POS\.exe$"
                  }

              if ($null -eq $exeEntry) {
                  Write-Error "ERROR: update.zip no contiene PAPELERA_POS.exe"
                  exit 1
              }

              $versionEntry = $names |
                  Where-Object {
                      $_ -match "^version\.txt$"
                  }

              if ($null -eq $versionEntry) {
                  Write-Error "ERROR: update.zip no contiene version.txt"
                  exit 1
              }

              $internalEntry = $names |
                  Where-Object {
                      $_ -match "^_internal/"
                  }

              if ($null -eq $internalEntry) {
                  Write-Error "ERROR: update.zip no contiene _internal"
                  exit 1
              }

              $dotenvEntry = $names |
                  Where-Object {
                      $_ -match "^_internal[/\\]dotenv[/\\]__init__\.py$"
                  }

              if ($null -eq $dotenvEntry) {
                  Write-Error "ERROR CRITICO: update.zip NO contiene _internal\dotenv\__init__.py"
                  exit 1
              }

              $certEntry = $names |
                  Where-Object {
                      $_ -match "^_internal[/\\]certifi[/\\]cacert\.pem$"
                  }

              if ($null -eq $certEntry) {
                  Write-Error "ERROR: update.zip NO contiene certifi\cacert.pem"
                  exit 1
              }

              Write-Host ""
              Write-Host "==========================================" -ForegroundColor Green
              Write-Host "ZIP VERIFICADO CORRECTAMENTE" -ForegroundColor Green
              Write-Host "==========================================" -ForegroundColor Green
              Write-Host ""
              Write-Host "PAPELERA_POS.exe: OK" -ForegroundColor Green
              Write-Host "version.txt: OK" -ForegroundColor Green
              Write-Host "_internal: OK" -ForegroundColor Green
              Write-Host "dotenv: OK" -ForegroundColor Green
              Write-Host "certifi: OK" -ForegroundColor Green
          }
          finally {
              $zip.Dispose()
          }

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: update
          path: update.zip

      - name: Crear Release
        uses: softprops/action-gh-release@v2
        with:
          files: update.zip
          generate_release_notes: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
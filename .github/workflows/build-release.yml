name: Crear Update PAPELERA POS

on:
  push:
    tags:
      - "v*"

jobs:
  build-update:
    runs-on: windows-latest

    steps:

      # ==================================================
      # DESCARGAR REPOSITORIO
      # ==================================================

      - name: Descargar repositorio
        uses: actions/checkout@v4


      # ==================================================
      # INSTALAR PYTHON
      # ==================================================

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"


      # ==================================================
      # INSTALAR DEPENDENCIAS
      # ==================================================

      - name: Instalar dependencias
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install python-dotenv

          python -c "import dotenv; print('python-dotenv OK:', dotenv.__file__)"


      # ==================================================
      # OBTENER VERSION
      # ==================================================

      - name: Obtener version
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}".Replace("v", "")

          "VERSION=$version" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host "VERSION DEL RELEASE" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host ""

          Write-Host "Tag: ${{ github.ref_name }}"
          Write-Host "Version: $version"

          Write-Host ""


      # ==================================================
      # CREAR EXE
      # ==================================================

      - name: Crear EXE con PyInstaller
        shell: powershell
        run: |
          python -m PyInstaller --clean PAPELERA_POS.spec

          if ($LASTEXITCODE -ne 0) {
            Write-Error "PyInstaller fallo."
            exit 1
          }


      # ==================================================
      # VERIFICAR COMPILACION
      # ==================================================

      - name: Verificar compilacion
        shell: powershell
        run: |
          $exe = "dist\PAPELERA_POS\PAPELERA_POS.exe"
          $internal = "dist\PAPELERA_POS\_internal"

          if (!(Test-Path -LiteralPath $exe)) {
            Write-Error "No existe PAPELERA_POS.exe"
            exit 1
          }

          if (!(Test-Path -LiteralPath $internal)) {
            Write-Error "No existe _internal"
            exit 1
          }

          Write-Host ""
          Write-Host "PAPELERA_POS.exe encontrado." -ForegroundColor Green
          Write-Host "_internal encontrado." -ForegroundColor Green
          Write-Host ""


      # ==================================================
      # FORZAR PYTHON-DOTENV
      # ==================================================

      - name: Forzar python-dotenv
        shell: powershell
        run: |
          $python = (Get-Command python).Source

          Write-Host ""
          Write-Host "Python:"
          Write-Host $python
          Write-Host ""

          $site = python -c "import sysconfig; print(sysconfig.get_path('purelib'))"

          Write-Host "Site-packages:"
          Write-Host $site
          Write-Host ""

          $source = Join-Path $site "dotenv"
          $target = Join-Path `
            "dist\PAPELERA_POS\_internal" `
            "dotenv"

          Write-Host "Origen dotenv:"
          Write-Host $source
          Write-Host ""

          Write-Host "Destino dotenv:"
          Write-Host $target
          Write-Host ""

          if (!(Test-Path -LiteralPath $source)) {
              Write-Error "No se encontro dotenv en $source"
              exit 1
          }

          if (Test-Path -LiteralPath $target) {
              Remove-Item `
                -LiteralPath $target `
                -Recurse `
                -Force
          }

          Copy-Item `
            -LiteralPath $source `
            -Destination $target `
            -Recurse `
            -Force

          Write-Host ""
          Write-Host "dotenv copiado correctamente." -ForegroundColor Green
          Write-Host ""

          $distInfo = Get-ChildItem `
            -LiteralPath $site `
            -Directory `
            -Filter "python_dotenv-*.dist-info" |
            Select-Object -First 1

          if ($null -ne $distInfo) {

              $distTarget = Join-Path `
                "dist\PAPELERA_POS\_internal" `
                $distInfo.Name

              if (Test-Path -LiteralPath $distTarget) {
                  Remove-Item `
                    -LiteralPath $distTarget `
                    -Recurse `
                    -Force
              }

              Copy-Item `
                -LiteralPath $distInfo.FullName `
                -Destination $distTarget `
                -Recurse `
                -Force

              Write-Host "python-dotenv dist-info copiado." -ForegroundColor Green
          }

      # ==================================================
      # VERIFICAR DOTENV
      # ==================================================

      - name: Verificar dotenv
        shell: powershell
        run: |
          $dotenv = "dist\PAPELERA_POS\_internal\dotenv"
          $init = "dist\PAPELERA_POS\_internal\dotenv\__init__.py"

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host "VERIFICANDO PYTHON-DOTENV" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host ""

          if (!(Test-Path -LiteralPath $dotenv)) {
            Write-Error "Falta carpeta dotenv."
            exit 1
          }

          if (!(Test-Path -LiteralPath $init)) {
            Write-Error "Falta dotenv\__init__.py."
            exit 1
          }

          Write-Host "dotenv encontrado correctamente." -ForegroundColor Green
          Write-Host "Ruta: $dotenv" -ForegroundColor Green
          Write-Host ""

          Get-ChildItem `
            -LiteralPath $dotenv


      # ==================================================
      # CREAR VERSION.TXT
      # ==================================================

      - name: Crear version.txt
        shell: powershell
        run: |
          $rootVersion = "dist\PAPELERA_POS\version.txt"
          $internalVersion = "dist\PAPELERA_POS\_internal\version.txt"

          Set-Content `
            -LiteralPath $rootVersion `
            -Value $env:VERSION `
            -Encoding UTF8

          Set-Content `
            -LiteralPath $internalVersion `
            -Value $env:VERSION `
            -Encoding UTF8

          Write-Host ""
          Write-Host "version.txt creado." -ForegroundColor Green
          Write-Host "Version: $env:VERSION"
          Write-Host ""


      # ==================================================
      # VERIFICAR VERSION
      # ==================================================

      - name: Verificar version
        shell: powershell
        run: |
          $v1 = (
            Get-Content `
              -LiteralPath "dist\PAPELERA_POS\version.txt" `
              -Raw
          ).Trim()

          $v2 = (
            Get-Content `
              -LiteralPath "dist\PAPELERA_POS\_internal\version.txt" `
              -Raw
          ).Trim()

          Write-Host "Version raiz: $v1"
          Write-Host "Version _internal: $v2"
          Write-Host ""

          if ($v1 -ne $env:VERSION) {
            Write-Error "version.txt de raiz incorrecto."
            exit 1
          }

          if ($v2 -ne $env:VERSION) {
            Write-Error "version.txt de _internal incorrecto."
            exit 1
          }

          Write-Host "Versiones correctas." -ForegroundColor Green


      # ==================================================
      # VERIFICAR CERTIFI
      # ==================================================

      - name: Verificar certifi
        shell: powershell
        run: |
          $cert = "dist\PAPELERA_POS\_internal\certifi\cacert.pem"

          if (!(Test-Path -LiteralPath $cert)) {
            Write-Error "Falta certifi\cacert.pem"
            exit 1
          }

          Write-Host "certifi OK." -ForegroundColor Green


      # ==================================================
      # PREPARAR UPDATE
      # ==================================================

      - name: Preparar update
        shell: powershell
        run: |
          if (Test-Path -LiteralPath "update") {
            Remove-Item `
              -LiteralPath "update" `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "update" `
            | Out-Null

          Copy-Item `
            -LiteralPath "dist\PAPELERA_POS\PAPELERA_POS.exe" `
            -Destination "update\PAPELERA_POS.exe" `
            -Force

          Copy-Item `
            -LiteralPath "dist\PAPELERA_POS\version.txt" `
            -Destination "update\version.txt" `
            -Force

          Copy-Item `
            -LiteralPath "dist\PAPELERA_POS\_internal" `
            -Destination "update\_internal" `
            -Recurse `
            -Force

          Write-Host ""
          Write-Host "Carpeta update preparada." -ForegroundColor Green
          Write-Host ""


      # ==================================================
      # VERIFICAR UPDATE
      # ==================================================

      - name: Verificar update
        shell: powershell
        run: |
          $exe = "update\PAPELERA_POS.exe"
          $version = "update\version.txt"
          $internal = "update\_internal"
          $dotenv = "update\_internal\dotenv\__init__.py"
          $cert = "update\_internal\certifi\cacert.pem"

          if (!(Test-Path -LiteralPath $exe)) {
            Write-Error "Falta PAPELERA_POS.exe"
            exit 1
          }

          if (!(Test-Path -LiteralPath $version)) {
            Write-Error "Falta version.txt"
            exit 1
          }

          if (!(Test-Path -LiteralPath $internal)) {
            Write-Error "Falta _internal"
            exit 1
          }

          if (!(Test-Path -LiteralPath $dotenv)) {
            Write-Error "Falta dotenv\__init__.py en update"
            exit 1
          }

          if (!(Test-Path -LiteralPath $cert)) {
            Write-Error "Falta certifi\cacert.pem en update"
            exit 1
          }

          $updateVersion = (
            Get-Content `
              -LiteralPath $version `
              -Raw
          ).Trim()

          if ($updateVersion -ne $env:VERSION) {
            Write-Error "Version incorrecta en update."
            exit 1
          }

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host "UPDATE COMPLETO Y CORRECTO" -ForegroundColor Green
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host ""

          Write-Host "Version: $updateVersion"
          Write-Host "dotenv: OK"
          Write-Host "certifi: OK"
          Write-Host ""


      # ==================================================
      # CREAR ZIP
      # ==================================================

      - name: Crear update.zip
        shell: powershell
        run: |
          if (Test-Path -LiteralPath "update.zip") {
            Remove-Item `
              -LiteralPath "update.zip" `
              -Force
          }

          Compress-Archive `
            -Path "update\*" `
            -DestinationPath "update.zip" `
            -CompressionLevel Optimal

          if (!(Test-Path -LiteralPath "update.zip")) {
            Write-Error "No se creo update.zip"
            exit 1
          }

          Write-Host ""
          Write-Host "update.zip creado correctamente." -ForegroundColor Green
          Write-Host ""


      # ==================================================
      # VERIFICAR ZIP
      # ==================================================

      - name: Verificar contenido del ZIP
        shell: powershell
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $zipPath = (
            Resolve-Path -LiteralPath "update.zip"
          ).Path

          $zip = [System.IO.Compression.ZipFile]::OpenRead(
            $zipPath
          )

          try {
            $names = @(
              $zip.Entries |
              ForEach-Object {
                $_.FullName
              }
            )

            Write-Host ""
            Write-Host "==========================================" -ForegroundColor Cyan
            Write-Host "CONTENIDO DEL ZIP" -ForegroundColor Cyan
            Write-Host "==========================================" -ForegroundColor Cyan
            Write-Host ""

            $names |
              Where-Object {
                $_ -match "dotenv"
              } |
              ForEach-Object {
                Write-Host $_
              }

            Write-Host ""

            $exeEntry = $names |
              Where-Object {
                $_ -match "PAPELERA_POS\.exe$"
              } |
              Select-Object -First 1

            $versionEntry = $names |
              Where-Object {
                $_ -match "version\.txt$"
              } |
              Select-Object -First 1

            $dotenvEntry = $names |
              Where-Object {
                $_ -match "_internal[/\\]dotenv[/\\]__init__\.py$"
              } |
              Select-Object -First 1

            $certEntry = $names |
              Where-Object {
                $_ -match "_internal[/\\]certifi[/\\]cacert\.pem$"
              } |
              Select-Object -First 1

            if ($null -eq $exeEntry) {
              Write-Error "Falta PAPELERA_POS.exe en update.zip"
              exit 1
            }

            if ($null -eq $versionEntry) {
              Write-Error "Falta version.txt en update.zip"
              exit 1
            }

            if ($null -eq $dotenvEntry) {
              Write-Error "ERROR CRITICO: update.zip NO contiene dotenv\__init__.py"
              exit 1
            }

            if ($null -eq $certEntry) {
              Write-Error "ERROR: update.zip NO contiene certifi\cacert.pem"
              exit 1
            }

            Write-Host ""
            Write-Host "PAPELERA_POS.exe: OK" -ForegroundColor Green
            Write-Host "version.txt: OK" -ForegroundColor Green
            Write-Host "dotenv\__init__.py: OK" -ForegroundColor Green
            Write-Host "certifi\cacert.pem: OK" -ForegroundColor Green
            Write-Host ""
            Write-Host "ZIP VERIFICADO CORRECTAMENTE." -ForegroundColor Green
            Write-Host ""
          }
          finally {
            $zip.Dispose()
          }


      # ==================================================
      # SUBIR ARTIFACT
      # ==================================================

      - name: Subir update.zip como artifact
        uses: actions/upload-artifact@v4
        with:
          name: update
          path: update.zip


      # ==================================================
      # CREAR RELEASE
      # ==================================================

      - name: Crear Release y subir update.zip
        uses: softprops/action-gh-release@v2
        with:
          files: update.zip
          generate_release_notes: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
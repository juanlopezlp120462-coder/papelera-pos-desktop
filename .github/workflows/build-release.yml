name: Crear Update PAPELERA POS

on:
  push:
    tags:
      - "v*"

jobs:

  build-update:

    runs-on: windows-latest

    steps:

      # ==========================================
      # DESCARGAR REPOSITORIO
      # ==========================================

      - name: Descargar repositorio
        uses: actions/checkout@v4


      # ==========================================
      # INSTALAR PYTHON
      # ==========================================

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================
      # INSTALAR DEPENDENCIAS
      # ==========================================

      - name: Instalar dependencias
        shell: powershell
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ==========================================
      # MOSTRAR VERSION
      # ==========================================

      - name: Obtener version
        shell: powershell
        run: |

          $version = "${{ github.ref_name }}".Replace("v","")

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host "VERSION DEL RELEASE" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host ""

          Write-Host "Tag:"
          Write-Host "${{ github.ref_name }}"

          Write-Host ""

          Write-Host "Version:"
          Write-Host $version

          Write-Host ""

          "VERSION=$version" >> $env:GITHUB_ENV


      # ==========================================
      # CREAR EXE
      # ==========================================

      - name: Crear EXE con PyInstaller
        shell: powershell
        run: |

          python -m PyInstaller --clean PAPELERA_POS.spec

          if ($LASTEXITCODE -ne 0) {
              Write-Error "PyInstaller fallo."
              exit 1
          }


      # ==========================================
      # VERIFICAR EXE
      # ==========================================

      - name: Verificar EXE
        shell: powershell
        run: |

          if (!(Test-Path "dist\PAPELERA_POS\PAPELERA_POS.exe")) {

              Write-Error "NO EXISTE PAPELERA_POS.exe"

              exit 1
          }

          Write-Host ""
          Write-Host "OK: PAPELERA_POS.exe existe." -ForegroundColor Green


      # ==========================================
      # CREAR VERSION.TXT
      # ==========================================

      - name: Crear version.txt
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "Creando version.txt..." -ForegroundColor Cyan

          # VERSION EN LA RAIZ

          Set-Content `
            -Path "dist\PAPELERA_POS\version.txt" `
            -Value $env:VERSION `
            -Encoding UTF8


          # VERSION DENTRO DE INTERNAL

          if (!(Test-Path "dist\PAPELERA_POS\_internal")) {

              Write-Error "NO EXISTE _internal"

              exit 1
          }


          Set-Content `
            -Path "dist\PAPELERA_POS\_internal\version.txt" `
            -Value $env:VERSION `
            -Encoding UTF8


      # ==========================================
      # VERIFICAR VERSIONES
      # ==========================================

      - name: Verificar versiones
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host "VERIFICANDO VERSIONES" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host ""

          $v1 = (
              Get-Content `
                "dist\PAPELERA_POS\version.txt" `
                -Raw
          ).Trim()


          $v2 = (
              Get-Content `
                "dist\PAPELERA_POS\_internal\version.txt" `
                -Raw
          ).Trim()


          Write-Host "Raiz:"
          Write-Host $v1

          Write-Host ""

          Write-Host "_internal:"
          Write-Host $v2

          Write-Host ""


          if ($v1 -ne $env:VERSION) {

              Write-Error `
                "ERROR: version.txt de raiz incorrecto."

              exit 1
          }


          if ($v2 -ne $env:VERSION) {

              Write-Error `
                "ERROR: version.txt de _internal incorrecto."

              exit 1
          }


          Write-Host `
            "OK: Las dos versiones son $env:VERSION" `
            -ForegroundColor Green


      # ==========================================
      # VERIFICAR CERTIFICADO
      # ==========================================

      - name: Verificar certificado
        shell: powershell
        run: |

          if (!(Test-Path `
            "dist\PAPELERA_POS\_internal\certifi\cacert.pem")) {

              Write-Error `
                "ERROR: NO EXISTE certifi\cacert.pem"

              exit 1
          }

          Write-Host `
            "OK: certifi\cacert.pem existe" `
            -ForegroundColor Green


      # ==========================================
      # PREPARAR UPDATE
      # ==========================================

      - name: Preparar carpeta Update
        shell: powershell
        run: |

          if (Test-Path "update") {

              Remove-Item `
                "update" `
                -Recurse `
                -Force
          }


          New-Item `
            -ItemType Directory `
            -Path "update" `
            | Out-Null


          # ======================================
          # EXE
          # ======================================

          Copy-Item `
            "dist\PAPELERA_POS\PAPELERA_POS.exe" `
            "update\PAPELERA_POS.exe" `
            -Force


          # ======================================
          # VERSION
          # ======================================

          Copy-Item `
            "dist\PAPELERA_POS\version.txt" `
            "update\version.txt" `
            -Force


          # ======================================
          # INTERNAL COMPLETO
          # ======================================

          Copy-Item `
            "dist\PAPELERA_POS\_internal" `
            "update\_internal" `
            -Recurse `
            -Force


      # ==========================================
      # VERIFICAR UPDATE
      # ==========================================

      - name: Verificar carpeta Update
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host "CONTENIDO UPDATE" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host ""

          Get-ChildItem `
            "update" `
            -Recurse


          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host "VERIFICANDO VERSION" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host ""


          if (!(Test-Path "update\version.txt")) {

              Write-Error "FALTA update\version.txt"

              exit 1
          }


          $updateVersion = (
              Get-Content `
                "update\version.txt" `
                -Raw
          ).Trim()


          Write-Host "Version del update:"
          Write-Host $updateVersion


          if ($updateVersion -ne $env:VERSION) {

              Write-Error `
                "ERROR: VERSION INCORRECTA EN UPDATE"

              exit 1
          }


      # ==========================================
      # VERIFICAR INTERNAL
      # ==========================================

      - name: Verificar Internal
        shell: powershell
        run: |

          if (!(Test-Path "update\_internal")) {

              Write-Error `
                "FALTA update\_internal"

              exit 1
          }


          if (!(Test-Path "update\_internal\version.txt")) {

              Write-Error `
                "FALTA update\_internal\version.txt"

              exit 1
          }


          $internalVersion = (
              Get-Content `
                "update\_internal\version.txt" `
                -Raw
          ).Trim()


          if ($internalVersion -ne $env:VERSION) {

              Write-Error `
                "ERROR: VERSION INCORRECTA EN _internal"

              exit 1
          }


          if (!(Test-Path `
            "update\_internal\certifi\cacert.pem")) {

              Write-Error `
                "FALTA certifi\cacert.pem"

              exit 1
          }


          Write-Host ""
          Write-Host `
            "OK: UPDATE COMPLETO Y CORRECTO" `
            -ForegroundColor Green


      # ==========================================
      # CREAR ZIP
      # ==========================================

      - name: Crear update.zip
        shell: powershell
        run: |

          if (Test-Path "update.zip") {

              Remove-Item `
                "update.zip" `
                -Force
          }


          Compress-Archive `
            -Path "update\*" `
            -DestinationPath "update.zip" `
            -CompressionLevel Optimal


          if (!(Test-Path "update.zip")) {

              Write-Error `
                "NO SE CREO update.zip"

              exit 1
          }


          Write-Host ""
          Write-Host `
            "OK: update.zip creado." `
            -ForegroundColor Green


      # ==========================================
      # VERIFICAR ZIP
      # ==========================================

      - name: Verificar update.zip
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host "CONTENIDO DEL ZIP" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host ""

          tar -tf update.zip


          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host "VERIFICAR ARCHIVOS" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host ""


          $contenido = tar -tf update.zip


          if (!($contenido -match "PAPELERA_POS.exe")) {

              Write-Error `
                "ERROR: Falta PAPELERA_POS.exe"

              exit 1
          }


          if (!($contenido -match "version.txt")) {

              Write-Error `
                "ERROR: Falta version.txt"

              exit 1
          }


          if (!($contenido -match "_internal")) {

              Write-Error `
                "ERROR: Falta _internal"

              exit 1
          }


          if (!(
            $contenido -match `
            "certifi/cacert.pem|certifi\\cacert.pem"
          )) {

              Write-Error `
                "ERROR: Falta certifi\cacert.pem"

              exit 1
          }


          Write-Host ""
          Write-Host `
            "OK: update.zip contiene todos los archivos." `
            -ForegroundColor Green


      # ==========================================
      # SUBIR ARTIFACT
      # ==========================================

      - name: Subir update.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: update
          path: update.zip


      # ==========================================
      # CREAR RELEASE
      # ==========================================

      - name: Crear Release y subir update.zip
        uses: softprops/action-gh-release@v2
        with:
          files: update.zip
          generate_release_notes: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
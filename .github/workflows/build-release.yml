name: Crear Update PAPELERA POS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
jobs:

  build-update:

    runs-on: windows-latest

    steps:

      # ==================================================
      # DESCARGAR REPOSITORIO
      # ==================================================

      - name: Descargar repositorio
        uses: actions/checkout@v4


      # ==================================================
      # INSTALAR PYTHON
      # ==================================================

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==================================================
      # INSTALAR DEPENDENCIAS
      # ==================================================

      - name: Instalar dependencias
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host "INSTALANDO DEPENDENCIAS" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host ""

          python -m pip install --upgrade pip

          python -m pip install -r requirements.txt

          python -m pip install `
            supabase `
            postgrest `
            realtime-py `
            storage3 `
            supabase-auth `
            supabase-functions `
            pydantic `
            pydantic-core `
            httpx `
            httpcore `
            anyio `
            websockets `
            PyJWT `
            cryptography `
            cffi `
            python-dotenv `
            certifi

          Write-Host ""
          Write-Host "DEPENDENCIAS INSTALADAS." -ForegroundColor Green

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host "VERIFICANDO DEPENDENCIAS" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host ""

          python -c "import supabase; print('SUPABASE:', supabase.__file__)"
          python -c "import postgrest; print('POSTGREST:', postgrest.__file__)"
          python -c "import realtime; print('REALTIME:', realtime.__file__)"
          python -c "import storage3; print('STORAGE3:', storage3.__file__)"
          python -c "import supabase_auth; print('SUPABASE_AUTH:', supabase_auth.__file__)"
          python -c "import supabase_functions; print('SUPABASE_FUNCTIONS:', supabase_functions.__file__)"
          python -c "import pydantic; print('PYDANTIC:', pydantic.__file__)"
          python -c "import dotenv; print('DOTENV:', dotenv.__file__)"

          Write-Host ""
          Write-Host "Dependencias verificadas." -ForegroundColor Green
          Write-Host ""


      # ==================================================
      # OBTENER VERSION
      # ==================================================

      - name: Obtener version
        shell: powershell
        run: |

          $version = "${{ github.ref_name }}"

          if ($version.StartsWith("v")) {
              $version = $version.Substring(1)
          }

          if ([string]::IsNullOrWhiteSpace($version)) {
              Write-Error "No se pudo obtener la version."
              exit 1
          }

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host "VERSION DEL RELEASE" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host ""

          Write-Host "Tag: ${{ github.ref_name }}"
          Write-Host "Version: $version"

          Write-Host ""

          "VERSION=$version" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append


      # ==================================================
      # CREAR EXE
      # ==================================================

      - name: Crear EXE con PyInstaller
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host "LIMPIANDO BUILD ANTERIOR" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host ""

          if (Test-Path -LiteralPath "build") {
              Remove-Item `
                -LiteralPath "build" `
                -Recurse `
                -Force
          }

          if (Test-Path -LiteralPath "dist") {
              Remove-Item `
                -LiteralPath "dist" `
                -Recurse `
                -Force
          }

          Write-Host "build y dist eliminados." -ForegroundColor Green
          Write-Host ""

          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host "CREANDO EXE CON PYINSTALLER" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host ""

          python -m PyInstaller --clean PAPELERA_POS.spec

          if ($LASTEXITCODE -ne 0) {
              Write-Error "PyInstaller fallo."
              exit 1
          }


          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "DEPENDENCIAS SUPABASE COPIADAS CORRECTAMENTE" -ForegroundColor Green
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host ""

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host "CONTENIDO REAL DE DIST" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host ""

          Get-ChildItem -LiteralPath "dist" -Force |
              Select-Object Name, FullName |
              Format-Table -AutoSize

          Write-Host ""
          Write-Host "CARPETAS DENTRO DE DIST:" -ForegroundColor Cyan

          Get-ChildItem -LiteralPath "dist" -Directory -Force |
              ForEach-Object {
                  Write-Host "[$($_.Name)]"
              }

          Write-Host ""
          Write-Host "PyInstaller termino correctamente." -ForegroundColor Green
          Write-Host ""
      # ==================================================
      # VERIFICAR COMPILACION
      # ==================================================

      - name: Verificar compilacion
        shell: powershell
        run: |

          $exe = "dist\PAPELERA_POS\PAPELERA_POS.exe"
          $internal = "dist\PAPELERA_POS\_internal"

          if (!(Test-Path -LiteralPath $exe)) {

              Write-Error "No existe PAPELERA_POS.exe"
              exit 1
          }

          if (!(Test-Path -LiteralPath $internal)) {

              Write-Error "No existe _internal"
              exit 1
          }

          Write-Host ""
          Write-Host "PAPELERA_POS.exe encontrado." -ForegroundColor Green
          Write-Host "_internal encontrado." -ForegroundColor Green
          Write-Host ""

      - name: Verificar estructura limpia de _internal
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          $internal = "dist\PAPELERA_POS\_internal"

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host "VERIFICANDO ESTRUCTURA DE _internal" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host ""

          if (!(Test-Path -LiteralPath $internal)) {
              Write-Error "No existe _internal."
              exit 1
          }

          $nestedInternal = Get-ChildItem `
              -LiteralPath $internal `
              -Directory `
              -Recurse `
              -Force |
              Where-Object {
                  $_.Name -eq "_internal"
              }

          if ($nestedInternal.Count -gt 0) {

              Write-Host ""
              Write-Host "SE ENCONTRARON CARPETAS _internal ANIDADAS:" `
                -ForegroundColor Red

              $nestedInternal |
                  ForEach-Object {
                      Write-Host $_.FullName
                  }

              Write-Error `
                "ERROR: existe _internal dentro de _internal."

              exit 1
          }

          $nestedVersions = Get-ChildItem `
              -LiteralPath $internal `
              -Recurse `
              -File `
              -Force |
              Where-Object {
                  $_.Name -eq "version.txt"
              }

          if ($nestedVersions.Count -ne 1) {

              Write-Host ""
              Write-Host "VERSION.TXT ENCONTRADOS DENTRO DE _internal:" `
                -ForegroundColor Yellow

              if ($nestedVersions.Count -eq 0) {
                  Write-Host "NO SE ENCONTRO NINGUNO."
              }
              else {
                  $nestedVersions |
                      ForEach-Object {
                          Write-Host $_.FullName
                      }
              }

              Write-Error `
                "ERROR: _internal debe contener exactamente un version.txt."

              exit 1
          }

          Write-Host ""
          Write-Host "ESTRUCTURA DE _internal CORRECTA." `
            -ForegroundColor Green

          Write-Host ""
      # ==================================================
      # VERIFICAR ESTRUCTURA DE DIST
      # ==================================================

      - name: Verificar Supabase en dist
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host "VERIFICANDO ESTRUCTURA REAL DE DIST" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host ""

          $dist = "dist\PAPELERA_POS"
          $internal = "dist\PAPELERA_POS\_internal"

          if (!(Test-Path -LiteralPath $dist)) {
              Write-Error "NO EXISTE: $dist"
              exit 1
          }

          if (!(Test-Path -LiteralPath $internal)) {
              Write-Error "NO EXISTE: $internal"
              exit 1
          }

          Write-Host "Contenido de dist\PAPELERA_POS:" -ForegroundColor Yellow

          Get-ChildItem `
            -LiteralPath $dist `
            -Force |
            ForEach-Object {
                Write-Host "[$($_.Name)]"
            }

          Write-Host ""

          Write-Host "Carpetas directamente dentro de _internal:" -ForegroundColor Yellow

          Get-ChildItem `
            -LiteralPath $internal `
            -Directory `
            -Force |
            ForEach-Object {
                Write-Host "[$($_.Name)]"
            }

          Write-Host ""

          # --------------------------------------------------
          # DEPENDENCIAS OBLIGATORIAS
          # --------------------------------------------------

          $carpetas = @(
              "supabase",
              "postgrest",
              "realtime",
              "storage3",
              "supabase_auth",
              "supabase_functions",
              "pydantic"
          )

          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host "VERIFICANDO DEPENDENCIAS" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host ""

          foreach ($carpeta in $carpetas) {

              $ruta = Join-Path $internal $carpeta

              if (!(Test-Path -LiteralPath $ruta)) {

                  Write-Error "FALTA LA DEPENDENCIA: $ruta"
                  exit 1
              }

              $archivos = @(
                  Get-ChildItem `
                    -LiteralPath $ruta `
                    -Recurse `
                    -File `
                    -Force `
                    -ErrorAction Stop
              )

              if ($archivos.Count -eq 0) {

                  Write-Error "LA CARPETA ESTA VACIA: $ruta"
                  exit 1
              }

              Write-Host `
                "$carpeta : OK ($($archivos.Count) archivos)" `
                -ForegroundColor Green
          }

          Write-Host ""

          # --------------------------------------------------
          # BUSCAR _internal ANIDADOS
          # --------------------------------------------------

          $nestedInternal = @(
              Get-ChildItem `
                -LiteralPath $internal `
                -Directory `
                -Recurse `
                -Force |
                Where-Object {
                    $_.Name -eq "_internal"
                }
          )

          if ($nestedInternal.Count -gt 0) {

              Write-Host ""
              Write-Host "ERROR: SE ENCONTRO _internal ANIDADO." `
                -ForegroundColor Red

              $nestedInternal |
                ForEach-Object {
                    Write-Host $_.FullName
                }

              exit 1
          }

          Write-Host ""
          Write-Host "No existen carpetas _internal anidadas." `
            -ForegroundColor Green

          Write-Host ""
          Write-Host "TODAS LAS DEPENDENCIAS ESTAN CORRECTAMENTE EN _internal." `
            -ForegroundColor Green
          Write-Host ""


      # ==================================================
      # FORZAR PYTHON-DOTENV
      # ==================================================

      - name: Forzar python-dotenv
        shell: powershell
        run: |

          $python = (Get-Command python).Source

          Write-Host ""
          Write-Host "Python:"
          Write-Host $python
          Write-Host ""

          $site = python -c "import sysconfig; print(sysconfig.get_path('purelib'))"

          Write-Host "Site-packages:"
          Write-Host $site
          Write-Host ""

          $source = Join-Path $site "dotenv"

          $target = Join-Path `
            "dist\PAPELERA_POS\_internal" `
            "dotenv"

          Write-Host "Origen dotenv:"
          Write-Host $source
          Write-Host ""

          Write-Host "Destino dotenv:"
          Write-Host $target
          Write-Host ""

          if (!(Test-Path -LiteralPath $source)) {

              Write-Error "No se encontro dotenv en $source"
              exit 1
          }

          if (Test-Path -LiteralPath $target) {

              Remove-Item `
                -LiteralPath $target `
                -Recurse `
                -Force
          }

          Copy-Item `
            -LiteralPath $source `
            -Destination $target `
            -Recurse `
            -Force

          Write-Host ""
          Write-Host "dotenv copiado correctamente." `
            -ForegroundColor Green
          Write-Host ""

          $distInfo = Get-ChildItem `
            -LiteralPath $site `
            -Directory `
            -Filter "python_dotenv-*.dist-info" |
            Select-Object -First 1

          if ($null -ne $distInfo) {

              $distTarget = Join-Path `
                "dist\PAPELERA_POS\_internal" `
                $distInfo.Name

              if (Test-Path -LiteralPath $distTarget) {

                  Remove-Item `
                    -LiteralPath $distTarget `
                    -Recurse `
                    -Force
              }

              Copy-Item `
                -LiteralPath $distInfo.FullName `
                -Destination $distTarget `
                -Recurse `
                -Force

              Write-Host `
                "python-dotenv dist-info copiado." `
                -ForegroundColor Green
          }


      # ==================================================
      # VERIFICAR DOTENV
      # ==================================================

      - name: Verificar dotenv
        shell: powershell
        run: |

          $dotenv = "dist\PAPELERA_POS\_internal\dotenv"
          $init = "dist\PAPELERA_POS\_internal\dotenv\__init__.py"

          if (!(Test-Path -LiteralPath $dotenv)) {

              Write-Error "Falta carpeta dotenv."
              exit 1
          }

          if (!(Test-Path -LiteralPath $init)) {

              Write-Error "Falta dotenv\__init__.py."
              exit 1
          }

          Write-Host ""
          Write-Host "dotenv encontrado correctamente." `
            -ForegroundColor Green
          Write-Host ""


      # ==================================================
      # CREAR VERSION.TXT
      # ==================================================

      - name: Crear version.txt
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          $version = "${{ github.ref_name }}"

          if ($version.StartsWith("v")) {
              $version = $version.Substring(1)
          }

          if ([string]::IsNullOrWhiteSpace($version)) {
              Write-Error "No se pudo determinar la version."
              exit 1
          }

          $rootVersion = "dist\PAPELERA_POS\version.txt"
          $internalVersion = "dist\PAPELERA_POS\_internal\version.txt"

          if (!(Test-Path -LiteralPath "dist\PAPELERA_POS")) {
              Write-Error "No existe dist\PAPELERA_POS."
              exit 1
          }

          if (!(Test-Path -LiteralPath "dist\PAPELERA_POS\_internal")) {
              Write-Error "No existe dist\PAPELERA_POS\_internal."
              exit 1
          }

          Set-Content `
            -LiteralPath $rootVersion `
            -Value $version `
            -Encoding UTF8

          Set-Content `
            -LiteralPath $internalVersion `
            -Value $version `
            -Encoding UTF8

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host "VERSION.TXT" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host ""

          Write-Host "Version: $version"
          Write-Host "Raiz: $rootVersion"
          Write-Host "_internal: $internalVersion"

          Write-Host ""
          Write-Host "version.txt creados correctamente." -ForegroundColor Green
          Write-Host ""


      # ==================================================
      # VERIFICAR VERSION
      # ==================================================

      - name: Verificar version
        shell: powershell
        run: |

          $expectedVersion = "${{ github.ref_name }}"

          if ($expectedVersion.StartsWith("v")) {
              $expectedVersion = $expectedVersion.Substring(1)
          }

          $v1 = (
              Get-Content `
                -LiteralPath "dist\PAPELERA_POS\version.txt" `
                -Raw
          ).Trim()

          $v2 = (
              Get-Content `
                -LiteralPath "dist\PAPELERA_POS\_internal\version.txt" `
                -Raw
          ).Trim()

          Write-Host "Version raiz: $v1"
          Write-Host "Version _internal: $v2"
          Write-Host "Version esperada: $expectedVersion"
          Write-Host ""

          if ($v1 -ne $expectedVersion) {

              Write-Error "version.txt de raiz incorrecto."
              exit 1
          }

          if ($v2 -ne $expectedVersion) {

              Write-Error "version.txt de _internal incorrecto."
              exit 1
          }

          Write-Host "Versiones correctas." `
            -ForegroundColor Green


      # ==================================================
      # VERIFICAR CERTIFI
      # ==================================================

      - name: Verificar certifi
        shell: powershell
        run: |

          $cert = `
            "dist\PAPELERA_POS\_internal\certifi\cacert.pem"

          if (!(Test-Path -LiteralPath $cert)) {

              Write-Error "Falta certifi\cacert.pem"
              exit 1
          }

          Write-Host "certifi OK." `
            -ForegroundColor Green


      # ==================================================
      # PREPARAR UPDATE
      # ==================================================

      - name: Preparar update
        shell: powershell
        run: |

          if (Test-Path -LiteralPath "update") {

              Remove-Item `
                -LiteralPath "update" `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "update" |
            Out-Null

          Copy-Item `
            -LiteralPath "dist\PAPELERA_POS\PAPELERA_POS.exe" `
            -Destination "update\PAPELERA_POS.exe" `
            -Force

          Copy-Item `
            -LiteralPath "dist\PAPELERA_POS\version.txt" `
            -Destination "update\version.txt" `
            -Force

          Copy-Item `
            -LiteralPath "dist\PAPELERA_POS\_internal" `
            -Destination "update\_internal" `
            -Recurse `
            -Force

          Write-Host ""
          Write-Host "Carpeta update preparada." `
            -ForegroundColor Green
          Write-Host ""


      # ==================================================
      # VERIFICAR UPDATE COMPLETO
      # ==================================================

      - name: Verificar update completo
        shell: powershell
        run: |

          $exe = "update\PAPELERA_POS.exe"
          $version = "update\version.txt"
          $internal = "update\_internal"

          Write-Host ""
          Write-Host "==========================================" `
            -ForegroundColor Cyan
          Write-Host "VERIFICANDO UPDATE COMPLETO" `
            -ForegroundColor Cyan
          Write-Host "==========================================" `
            -ForegroundColor Cyan
          Write-Host ""

          # --------------------------------------------------
          # EXE
          # --------------------------------------------------

          if (!(Test-Path -LiteralPath $exe)) {

              Write-Error "Falta PAPELERA_POS.exe"
              exit 1
          }

          Write-Host "PAPELERA_POS.exe : OK" `
            -ForegroundColor Green


          # --------------------------------------------------
          # VERSION
          # --------------------------------------------------

          if (!(Test-Path -LiteralPath $version)) {

              Write-Error "Falta version.txt"
              exit 1
          }

          $expectedVersion = "${{ github.ref_name }}"

          if ($expectedVersion.StartsWith("v")) {
              $expectedVersion = $expectedVersion.Substring(1)
          }

          $updateVersion = (
              Get-Content `
                -LiteralPath $version `
                -Raw
          ).Trim()

          if ($updateVersion -ne $expectedVersion) {

              Write-Error `
                "Version incorrecta en update. Esperada: $expectedVersion - Encontrada: $updateVersion"

              exit 1
          }

          Write-Host "version.txt : OK ($updateVersion)" `
            -ForegroundColor Green


          # --------------------------------------------------
          # _internal
          # --------------------------------------------------

          if (!(Test-Path -LiteralPath $internal)) {

              Write-Error "Falta _internal"
              exit 1
          }

          Write-Host "_internal : OK" `
            -ForegroundColor Green
          # --------------------------------------------------
          # ESTRUCTURA _internal
          # --------------------------------------------------

          $nestedInternal = `
            "update\_internal\_internal"

          if (Test-Path -LiteralPath $nestedInternal) {

              Write-Error `
                "ERROR CRITICO: existe update\_internal\_internal."

              exit 1
          }

          Write-Host `
            "_internal sin carpetas _internal anidadas : OK" `
            -ForegroundColor Green


          # --------------------------------------------------
          # DOTENV
          # --------------------------------------------------

          $dotenv = `
            "update\_internal\dotenv\__init__.py"

          if (!(Test-Path -LiteralPath $dotenv)) {

              Write-Error "Falta dotenv\__init__.py en update."
              exit 1
          }

          Write-Host "dotenv : OK" `
            -ForegroundColor Green


          # --------------------------------------------------
          # CERTIFI
          # --------------------------------------------------

          $cert = `
            "update\_internal\certifi\cacert.pem"

          if (!(Test-Path -LiteralPath $cert)) {

              Write-Error "Falta certifi\cacert.pem en update."
              exit 1
          }

          Write-Host "certifi : OK" `
            -ForegroundColor Green


          # --------------------------------------------------
          # DATABASE
          # --------------------------------------------------

          $database = "update\database"

          if (Test-Path -LiteralPath $database) {

              Write-Error `
                "ERROR CRITICO: update contiene carpeta database."

              exit 1
          }

          $abril = Get-ChildItem `
            -LiteralPath "update" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -ieq "abril.db"
            }

          if ($abril) {

              Write-Error `
                "ERROR CRITICO: abril.db fue incluido en update."

              exit 1
          }

          Write-Host ""
          Write-Host "database : NO incluida" `
            -ForegroundColor Green

          Write-Host "abril.db : NO incluida" `
            -ForegroundColor Green


          # --------------------------------------------------
          # FINAL
          # --------------------------------------------------

          Write-Host ""
          Write-Host "==========================================" `
            -ForegroundColor Cyan

          Write-Host "UPDATE COMPLETO Y CORRECTO" `
            -ForegroundColor Green

          Write-Host "==========================================" `
            -ForegroundColor Cyan

          Write-Host ""


      # ==================================================
      # COMPROBAR QUE NO ESTE LA DATABASE
      # ==================================================

      - name: Verificar que database NO este incluida
        shell: powershell
        run: |

          $database = "update\database"

          if (Test-Path -LiteralPath $database) {

              Write-Error `
                "ERROR CRITICO: update contiene carpeta database."

              exit 1
          }

          $abril = Get-ChildItem `
            -LiteralPath "update" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -ieq "abril.db"
            }

          if ($abril) {

              Write-Error `
                "ERROR CRITICO: abril.db fue incluido en update."

              exit 1
          }

          Write-Host ""
          Write-Host "DATABASE: NO incluida." `
            -ForegroundColor Green
          Write-Host "abril.db: NO incluida." `
            -ForegroundColor Green
          Write-Host ""


      # ==================================================
      # CREAR ZIP
      # ==================================================

      - name: Crear update.zip
        shell: powershell
        run: |

          if (Test-Path -LiteralPath "update.zip") {

              Remove-Item `
                -LiteralPath "update.zip" `
                -Force
          }

          Compress-Archive `
            -Path "update\*" `
            -DestinationPath "update.zip" `
            -CompressionLevel Optimal

          if (!(Test-Path -LiteralPath "update.zip")) {

              Write-Error "No se creo update.zip"
              exit 1
          }

          Write-Host ""
          Write-Host "update.zip creado correctamente." `
            -ForegroundColor Green
          Write-Host ""


      # ==================================================
      # VERIFICAR ZIP FINAL
      # ==================================================

      - name: Verificar contenido final del ZIP
        shell: powershell
        run: |

          Add-Type `
            -AssemblyName System.IO.Compression.FileSystem

          $zipPath = (
            Resolve-Path -LiteralPath "update.zip"
          ).Path

          $zip = `
            [System.IO.Compression.ZipFile]::OpenRead($zipPath)

          try {

              $names = @(
                  $zip.Entries |
                  ForEach-Object {
                      $_.FullName -replace "\\", "/"
                  }
              )

              Write-Host ""
              Write-Host "==========================================" `
                -ForegroundColor Cyan
              Write-Host "VERIFICACION FINAL DEL ZIP" `
                -ForegroundColor Cyan
              Write-Host "==========================================" `
                -ForegroundColor Cyan
              Write-Host ""

              Write-Host "CONTENIDO DEL ZIP:" `
                -ForegroundColor Yellow

              foreach ($name in $names) {
                  Write-Host $name
              }

              Write-Host ""

              # --------------------------------------------------
              # FUNCION PARA BUSCAR ARCHIVOS DENTRO DE UNA CARPETA
              # --------------------------------------------------

              function Test-ZipPath {

                  param(
                      [string]$Path
                  )

                  $normalized = $Path -replace "\\", "/"

                  return (
                      $names |
                      Where-Object {
                          $_ -eq $normalized -or
                          $_ -like "$normalized/*"
                      } |
                      Select-Object -First 1
                  )
              }


              # --------------------------------------------------
              # DEPENDENCIAS
              # --------------------------------------------------

              $requiredFolders = @(
                  "_internal/supabase",
                  "_internal/postgrest",
                  "_internal/realtime",
                  "_internal/storage3",
                  "_internal/supabase_auth",
                  "_internal/supabase_functions",
                  "_internal/pydantic"
              )

              foreach ($folder in $requiredFolders) {

                  $found = Test-ZipPath $folder

                  if ($null -eq $found) {

                      Write-Error `
                        "ERROR CRITICO: falta $folder en update.zip"

                      exit 1
                  }

                  Write-Host `
                    "$folder : OK" `
                    -ForegroundColor Green
              }


              # --------------------------------------------------
              # DOTENV
              # --------------------------------------------------

              $dotenv = "_internal/dotenv/__init__.py"

              if ($null -eq (Test-ZipPath $dotenv)) {

                  Write-Error `
                    "ERROR CRITICO: falta $dotenv en update.zip"

                  exit 1
              }

              Write-Host `
                "_internal/dotenv : OK" `
                -ForegroundColor Green


              # --------------------------------------------------
              # CERTIFI
              # --------------------------------------------------

              $certifi = "_internal/certifi/cacert.pem"

              if ($null -eq (Test-ZipPath $certifi)) {

                  Write-Error `
                    "ERROR CRITICO: falta $certifi en update.zip"

                  exit 1
              }

              Write-Host `
                "_internal/certifi : OK" `
                -ForegroundColor Green


              # --------------------------------------------------
              # EXE
              # --------------------------------------------------

              $exeEntry = $names |
                Where-Object {
                    $_ -match "(^|/)PAPELERA_POS\.exe$"
                } |
                Select-Object -First 1

              if ($null -eq $exeEntry) {

                  Write-Error `
                    "ERROR CRITICO: falta PAPELERA_POS.exe en update.zip"

                  exit 1
              }

              Write-Host `
                "PAPELERA_POS.exe : OK" `
                -ForegroundColor Green


              # --------------------------------------------------
              # VERSION
              # --------------------------------------------------

              $versionEntry = $names |
                Where-Object {
                    $_ -match "(^|/)version\.txt$"
                } |
                Select-Object -First 1

              if ($null -eq $versionEntry) {

                  Write-Error `
                    "ERROR CRITICO: falta version.txt en update.zip"

                  exit 1
              }

              Write-Host `
                "version.txt : OK" `
                -ForegroundColor Green


              # --------------------------------------------------
              # DATABASE
              # --------------------------------------------------

              $databaseEntry = $names |
                Where-Object {

                    $_ -match "(^|/)database(/|$)" -or
                    $_ -match "(^|/)abril\.db$"

                } |
                Select-Object -First 1

              if ($null -ne $databaseEntry) {

                  Write-Error `
                    "ERROR CRITICO: database/abril.db aparece en update.zip"

                  exit 1
              }

              Write-Host `
                "database : NO incluida" `
                -ForegroundColor Green

              Write-Host `
                "abril.db : NO incluida" `
                -ForegroundColor Green


              # --------------------------------------------------
              # FINAL
              # --------------------------------------------------

              Write-Host ""
              Write-Host "==========================================" `
                -ForegroundColor Cyan
              Write-Host "ZIP FINAL VERIFICADO CORRECTAMENTE" `
                -ForegroundColor Green
              Write-Host "==========================================" `
                -ForegroundColor Cyan
              Write-Host ""

          }
          finally {

              $zip.Dispose()
          }


      # ==================================================
      # SUBIR ARTIFACT
      # ==================================================

      - name: Subir update.zip como artifact
        uses: actions/upload-artifact@v4
        with:
          name: update-${{ github.ref_name }}
          path: update.zip
          if-no-files-found: error


      # ==================================================
      # CREAR RELEASE
      # ==================================================

      - name: Crear Release y subir update.zip
        uses: softprops/action-gh-release@v2
        with:
          files: update.zip
          generate_release_notes: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

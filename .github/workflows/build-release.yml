name: Crear Update PAPELERA POS

on:
  push:
    tags:
      - "v*"

jobs:

  build-update:

    runs-on: windows-latest

    steps:

    - name: Descargar repositorio
      uses: actions/checkout@v4


    - name: Instalar Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"


    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt


    - name: Crear EXE con PyInstaller
      run: |
        pyinstaller PAPELERA_POS.spec


    - name: Crear version.txt
      shell: powershell
      run: |
        Set-Content -Path "dist\PAPELERA_POS\version.txt" -Value "${{ github.ref_name }}"


    # CREAR UPDATE LIMPIO
    # Copia solamente el contenido del programa,
    # NO la carpeta PAPELERA_POS completa

    - name: Preparar carpeta Update
      shell: powershell
      run: |

        if (Test-Path update) {
            Remove-Item update -Recurse -Force
        }

        New-Item -ItemType Directory -Path update

        Copy-Item `
          "dist\PAPELERA_POS\PAPELERA_POS.exe" `
          "update\PAPELERA_POS.exe"


        Copy-Item `
          "dist\PAPELERA_POS\version.txt" `
          "update\version.txt"


        Copy-Item `
          "dist\PAPELERA_POS\_internal" `
          "update\_internal" `
          -Recurse


    - name: Crear update.zip
      shell: powershell
      run: |

        if (Test-Path update.zip) {
            Remove-Item update.zip -Force
        }

        Compress-Archive `
          -Path "update\*" `
          -DestinationPath "update.zip"



    - name: Subir update.zip
      uses: actions/upload-artifact@v4
      with:

        name: update

        path: update.zip
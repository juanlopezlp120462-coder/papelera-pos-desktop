name: Crear Update PAPELERA POS

on:
  push:
    tags:
      - "v*"

jobs:
  build-update:
    runs-on: windows-latest

    steps:

      # ==================================================
      # DESCARGAR REPOSITORIO
      # ==================================================

      - name: Descargar repositorio
        uses: actions/checkout@v4


      # ==================================================
      # INSTALAR PYTHON
      # ==================================================

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"


      # ==================================================
      # INSTALAR DEPENDENCIAS
      # ==================================================

      - name: Instalar dependencias
        shell: powershell
        run: |
          python -m pip install --upgrade pip

          pip install -r requirements.txt

          pip install python-dotenv

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host "VERIFICANDO DEPENDENCIAS" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host ""

          python -c "import supabase; print('SUPABASE:', supabase.__file__)"
          python -c "import postgrest; print('POSTGREST:', postgrest.__file__)"
          python -c "import realtime; print('REALTIME:', realtime.__file__)"
          python -c "import storage3; print('STORAGE3:', storage3.__file__)"
          python -c "import supabase_auth; print('SUPABASE_AUTH:', supabase_auth.__file__)"
          python -c "import supabase_functions; print('SUPABASE_FUNCTIONS:', supabase_functions.__file__)"
          python -c "import pydantic; print('PYDANTIC:', pydantic.__file__)"
          python -c "import dotenv; print('DOTENV:', dotenv.__file__)"

          Write-Host ""
          Write-Host "Dependencias verificadas." -ForegroundColor Green
          Write-Host ""


      # ==================================================
      # OBTENER VERSION
      # ==================================================

      - name: Obtener version
        shell: powershell
        run: |

          $version = "${{ github.ref_name }}"

          if ($version.StartsWith("v")) {
              $version = $version.Substring(1)
          }

          if ([string]::IsNullOrWhiteSpace($version)) {
              Write-Error "No se pudo obtener la version."
              exit 1
          }

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host "VERSION DEL RELEASE" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host ""

          Write-Host "Tag: ${{ github.ref_name }}"
          Write-Host "Version: $version"

          Write-Host ""

          "VERSION=$version" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append


      # ==================================================
      # CREAR EXE
      # ==================================================

      - name: Crear EXE con PyInstaller
        shell: powershell
        run: |

          python -m PyInstaller --clean PAPELERA_POS.spec

          if ($LASTEXITCODE -ne 0) {
              Write-Error "PyInstaller fallo."
              exit 1
          }

          Write-Host ""
          Write-Host "CONTENIDO REAL DE DIST:" -ForegroundColor Cyan

          Get-ChildItem `
            -LiteralPath "dist" `
            -Force |
            Format-Table Name, FullName

          Write-Host ""

          Write-Host "CARPETAS DENTRO DE DIST:" -ForegroundColor Cyan

          Get-ChildItem `
            -LiteralPath "dist" `
            -Directory `
            -Force |
            ForEach-Object {
                Write-Host "[$($_.Name)]"
            }

          Write-Host ""

          Write-Host "PyInstaller termino correctamente." `
            -ForegroundColor Green

          Write-Host ""

      # ==================================================
      # VERIFICAR COMPILACION
      # ==================================================

      - name: Verificar compilacion
        shell: powershell
        run: |

          $exe = "dist\PAPELERA_POS\PAPELERA_POS.exe"
          $internal = "dist\PAPELERA_POS\_internal"

          if (!(Test-Path -LiteralPath $exe)) {
              Write-Error "No existe PAPELERA_POS.exe"
              exit 1
          }

          if (!(Test-Path -LiteralPath $internal)) {
              Write-Error "No existe _internal"
              exit 1
          }

          Write-Host ""
          Write-Host "PAPELERA_POS.exe encontrado." -ForegroundColor Green
          Write-Host "_internal encontrado." -ForegroundColor Green
          Write-Host ""


      # ==================================================
      # VERIFICAR DEPENDENCIAS EMPAQUETADAS
      # ==================================================

      - name: Verificar dependencias empaquetadas
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host "VERIFICANDO DEPENDENCIAS EMPAQUETADAS" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host ""

          $exe = "dist\PAPELERA_POS\PAPELERA_POS.exe"

          if (!(Test-Path -LiteralPath $exe)) {
              Write-Error "NO EXISTE PAPELERA_POS.exe"
              exit 1
          }

          Write-Host "EXE encontrado:" -ForegroundColor Green
          Write-Host $exe
          Write-Host ""

          Write-Host "Tamaño del EXE:" -ForegroundColor Yellow

          $exeInfo = Get-Item -LiteralPath $exe

          Write-Host (
              "{0:N2} MB" -f ($exeInfo.Length / 1MB)
          )

          Write-Host ""

          # --------------------------------------------------
          # MOSTRAR ARCHIVO INTERNO DE PYINSTALLER
          # --------------------------------------------------

          Write-Host "Contenido de _internal:" -ForegroundColor Yellow

          Get-ChildItem `
            -LiteralPath "dist\PAPELERA_POS\_internal" `
            -Force |
            ForEach-Object {
                Write-Host "[$($_.Name)]"
            }

          Write-Host ""

          # --------------------------------------------------
          # BUSCAR ARCHIVOS RELACIONADOS
          # --------------------------------------------------

          Write-Host "Buscando archivos relacionados con Supabase..." `
            -ForegroundColor Yellow

          $busquedas = @(
              "supabase",
              "postgrest",
              "realtime",
              "storage3",
              "supabase_auth",
              "supabase_functions",
              "pydantic"
          )

          foreach ($nombre in $busquedas) {

              $resultado = Get-ChildItem `
                -LiteralPath "dist\PAPELERA_POS" `
                -Recurse `
                -Force `
                -ErrorAction SilentlyContinue |
                Where-Object {
                    $_.Name -like "*$nombre*"
                } |
                Select-Object -First 5

              if ($resultado) {

                  Write-Host ""
                  Write-Host "$nombre : ENCONTRADO" `
                    -ForegroundColor Green

                  foreach ($archivo in $resultado) {
                      Write-Host "  $($archivo.FullName)"
                  }

              } else {

                  Write-Host ""
                  Write-Host "$nombre : no aparece como archivo/carpeta independiente." `
                    -ForegroundColor Yellow
              }
          }

          Write-Host ""

          # --------------------------------------------------
          # INSPECCIONAR ARCHIVO PYZ
          # --------------------------------------------------

          Write-Host "Buscando archivos PYZ..." `
            -ForegroundColor Yellow

          $pyz = Get-ChildItem `
            -LiteralPath "dist\PAPELERA_POS\_internal" `
            -Recurse `
            -File `
            -Filter "*.pyz" `
            -ErrorAction SilentlyContinue

          if ($pyz) {

              foreach ($archivo in $pyz) {

                  Write-Host ""
                  Write-Host "PYZ encontrado:" `
                    -ForegroundColor Green

                  Write-Host $archivo.FullName
              }

          } else {

              Write-Host ""
              Write-Host "No se encontro archivo PYZ independiente." `
                -ForegroundColor Yellow
          }

          Write-Host ""

          Write-Host "==========================================" `
            -ForegroundColor Cyan

          Write-Host "NO SE EXIGE QUE SUPABASE SEA UNA CARPETA." `
            -ForegroundColor Green

          Write-Host "La verificacion continuara con el EXE." `
            -ForegroundColor Green

          Write-Host "==========================================" `
            -ForegroundColor Cyan

          Write-Host ""
      # ==================================================
      # FORZAR PYTHON-DOTENV
      # ==================================================

      - name: Forzar python-dotenv
        shell: powershell
        run: |

          $python = (Get-Command python).Source

          Write-Host ""
          Write-Host "Python:"
          Write-Host $python
          Write-Host ""

          $site = python -c "import sysconfig; print(sysconfig.get_path('purelib'))"

          Write-Host "Site-packages:"
          Write-Host $site
          Write-Host ""

          $source = Join-Path $site "dotenv"

          $target = Join-Path `
            "dist\PAPELERA_POS\_internal" `
            "dotenv"

          Write-Host "Origen dotenv:"
          Write-Host $source
          Write-Host ""

          Write-Host "Destino dotenv:"
          Write-Host $target
          Write-Host ""

          if (!(Test-Path -LiteralPath $source)) {

              Write-Error "No se encontro dotenv en $source"
              exit 1
          }

          if (Test-Path -LiteralPath $target) {

              Remove-Item `
                -LiteralPath $target `
                -Recurse `
                -Force
          }

          Copy-Item `
            -LiteralPath $source `
            -Destination $target `
            -Recurse `
            -Force

          Write-Host ""
          Write-Host "dotenv copiado correctamente." `
            -ForegroundColor Green
          Write-Host ""

          $distInfo = Get-ChildItem `
            -LiteralPath $site `
            -Directory `
            -Filter "python_dotenv-*.dist-info" |
            Select-Object -First 1

          if ($null -ne $distInfo) {

              $distTarget = Join-Path `
                "dist\PAPELERA_POS\_internal" `
                $distInfo.Name

              if (Test-Path -LiteralPath $distTarget) {

                  Remove-Item `
                    -LiteralPath $distTarget `
                    -Recurse `
                    -Force
              }

              Copy-Item `
                -LiteralPath $distInfo.FullName `
                -Destination $distTarget `
                -Recurse `
                -Force

              Write-Host `
                "python-dotenv dist-info copiado." `
                -ForegroundColor Green
          }


      # ==================================================
      # VERIFICAR DOTENV
      # ==================================================

      - name: Verificar dotenv
        shell: powershell
        run: |

          $dotenv = "dist\PAPELERA_POS\_internal\dotenv"
          $init = "dist\PAPELERA_POS\_internal\dotenv\__init__.py"

          if (!(Test-Path -LiteralPath $dotenv)) {

              Write-Error "Falta carpeta dotenv."
              exit 1
          }

          if (!(Test-Path -LiteralPath $init)) {

              Write-Error "Falta dotenv\__init__.py."
              exit 1
          }

          Write-Host ""
          Write-Host "dotenv encontrado correctamente." `
            -ForegroundColor Green
          Write-Host ""


      # ==================================================
      # CREAR VERSION.TXT
      # ==================================================

      - name: Crear version.txt
        shell: powershell
        run: |

          $version = "${{ github.ref_name }}"

          if ($version.StartsWith("v")) {
              $version = $version.Substring(1)
          }

          $rootVersion = "dist\PAPELERA_POS\version.txt"

          $internalVersion = `
            "dist\PAPELERA_POS\_internal\version.txt"

          Set-Content `
            -LiteralPath $rootVersion `
            -Value $version `
            -Encoding UTF8

          Set-Content `
            -LiteralPath $internalVersion `
            -Value $version `
            -Encoding UTF8

          Write-Host ""
          Write-Host "version.txt creado." -ForegroundColor Green
          Write-Host "Version: $version"
          Write-Host ""


      # ==================================================
      # VERIFICAR VERSION
      # ==================================================

      - name: Verificar version
        shell: powershell
        run: |

          $expectedVersion = "${{ github.ref_name }}"

          if ($expectedVersion.StartsWith("v")) {
              $expectedVersion = $expectedVersion.Substring(1)
          }

          $v1 = (
              Get-Content `
                -LiteralPath "dist\PAPELERA_POS\version.txt" `
                -Raw
          ).Trim()

          $v2 = (
              Get-Content `
                -LiteralPath "dist\PAPELERA_POS\_internal\version.txt" `
                -Raw
          ).Trim()

          Write-Host "Version raiz: $v1"
          Write-Host "Version _internal: $v2"
          Write-Host "Version esperada: $expectedVersion"
          Write-Host ""

          if ($v1 -ne $expectedVersion) {

              Write-Error "version.txt de raiz incorrecto."
              exit 1
          }

          if ($v2 -ne $expectedVersion) {

              Write-Error "version.txt de _internal incorrecto."
              exit 1
          }

          Write-Host "Versiones correctas." `
            -ForegroundColor Green


      # ==================================================
      # VERIFICAR CERTIFI
      # ==================================================

      - name: Verificar certifi
        shell: powershell
        run: |

          $cert = `
            "dist\PAPELERA_POS\_internal\certifi\cacert.pem"

          if (!(Test-Path -LiteralPath $cert)) {

              Write-Error "Falta certifi\cacert.pem"
              exit 1
          }

          Write-Host "certifi OK." `
            -ForegroundColor Green


      # ==================================================
      # PREPARAR UPDATE
      # ==================================================

      - name: Preparar update
        shell: powershell
        run: |

          if (Test-Path -LiteralPath "update") {

              Remove-Item `
                -LiteralPath "update" `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "update" `
            | Out-Null

          Copy-Item `
            -LiteralPath "dist\PAPELERA_POS\PAPELERA_POS.exe" `
            -Destination "update\PAPELERA_POS.exe" `
            -Force

          Copy-Item `
            -LiteralPath "dist\PAPELERA_POS\version.txt" `
            -Destination "update\version.txt" `
            -Force

          Copy-Item `
            -LiteralPath "dist\PAPELERA_POS\_internal" `
            -Destination "update\_internal" `
            -Recurse `
            -Force

          Write-Host ""
          Write-Host "Carpeta update preparada." `
            -ForegroundColor Green
          Write-Host ""


      # ==================================================
      # VERIFICAR UPDATE COMPLETO
      # ==================================================

      - name: Verificar update completo
        shell: powershell
        run: |

          $exe = "update\PAPELERA_POS.exe"
          $version = "update\version.txt"
          $internal = "update\_internal"

          if (!(Test-Path -LiteralPath $exe)) {

              Write-Error "Falta PAPELERA_POS.exe"
              exit 1
          }

          if (!(Test-Path -LiteralPath $version)) {

              Write-Error "Falta version.txt"
              exit 1
          }

          if (!(Test-Path -LiteralPath $internal)) {

              Write-Error "Falta _internal"
              exit 1
          }

          $carpetas = @(
              "supabase",
              "postgrest",
              "realtime",
              "storage3",
              "supabase_auth",
              "supabase_functions",
              "pydantic"
          )

          foreach ($carpeta in $carpetas) {

              $ruta = Join-Path $internal $carpeta

              if (!(Test-Path -LiteralPath $ruta)) {

                  Write-Error `
                    "ERROR CRITICO: falta _internal\$carpeta en update."
                  exit 1
              }

              $cantidad = @(
                  Get-ChildItem `
                    -LiteralPath $ruta `
                    -Recurse `
                    -File `
                    -ErrorAction Stop
              ).Count

              if ($cantidad -le 0) {

                  Write-Error `
                    "ERROR CRITICO: _internal\$carpeta esta vacia."
                  exit 1
              }

              Write-Host `
                "UPDATE _internal\$carpeta : OK ($cantidad archivos)" `
                -ForegroundColor Green
          }

          $dotenv = `
            "update\_internal\dotenv\__init__.py"

          $cert = `
            "update\_internal\certifi\cacert.pem"

          if (!(Test-Path -LiteralPath $dotenv)) {

              Write-Error "Falta dotenv\__init__.py en update."
              exit 1
          }

          if (!(Test-Path -LiteralPath $cert)) {

              Write-Error "Falta certifi\cacert.pem en update."
              exit 1
          }

          $expectedVersion = "${{ github.ref_name }}"

          if ($expectedVersion.StartsWith("v")) {
              $expectedVersion = $expectedVersion.Substring(1)
          }

          $updateVersion = (
              Get-Content `
                -LiteralPath $version `
                -Raw
          ).Trim()

          if ($updateVersion -ne $expectedVersion) {

              Write-Error `
                "Version incorrecta en update."
              exit 1
          }

          Write-Host ""
          Write-Host "==========================================" `
            -ForegroundColor Cyan
          Write-Host "UPDATE COMPLETO Y CORRECTO" `
            -ForegroundColor Green
          Write-Host "==========================================" `
            -ForegroundColor Cyan
          Write-Host ""

          Write-Host "Version: $updateVersion"
          Write-Host "Supabase: OK"
          Write-Host "PostgREST: OK"
          Write-Host "Realtime: OK"
          Write-Host "Storage3: OK"
          Write-Host "Supabase Auth: OK"
          Write-Host "Supabase Functions: OK"
          Write-Host "Pydantic: OK"
          Write-Host "dotenv: OK"
          Write-Host "certifi: OK"
          Write-Host ""


      # ==================================================
      # COMPROBAR QUE NO ESTE LA DATABASE
      # ==================================================

      - name: Verificar que database NO este incluida
        shell: powershell
        run: |

          $database = "update\database"

          if (Test-Path -LiteralPath $database) {

              Write-Error `
                "ERROR CRITICO: update contiene carpeta database."
              exit 1
          }

          $abril = Get-ChildItem `
            -LiteralPath "update" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -ieq "abril.db"
            }

          if ($abril) {

              Write-Error `
                "ERROR CRITICO: abril.db fue incluido en update."
              exit 1
          }

          Write-Host ""
          Write-Host "DATABASE: NO incluida." `
            -ForegroundColor Green
          Write-Host "abril.db: NO incluida." `
            -ForegroundColor Green
          Write-Host ""


      # ==================================================
      # CREAR ZIP
      # ==================================================

      - name: Crear update.zip
        shell: powershell
        run: |

          if (Test-Path -LiteralPath "update.zip") {

              Remove-Item `
                -LiteralPath "update.zip" `
                -Force
          }

          Compress-Archive `
            -Path "update\*" `
            -DestinationPath "update.zip" `
            -CompressionLevel Optimal

          if (!(Test-Path -LiteralPath "update.zip")) {

              Write-Error "No se creo update.zip"
              exit 1
          }

          Write-Host ""
          Write-Host "update.zip creado correctamente." `
            -ForegroundColor Green
          Write-Host ""


      # ==================================================
      # VERIFICAR ZIP FINAL
      # ==================================================

      - name: Verificar contenido final del ZIP
        shell: powershell
        run: |

          Add-Type `
            -AssemblyName System.IO.Compression.FileSystem

          $zipPath = (
            Resolve-Path -LiteralPath "update.zip"
          ).Path

          $zip = `
            [System.IO.Compression.ZipFile]::OpenRead($zipPath)

          try {

              $names = @(
                $zip.Entries |
                ForEach-Object {
                  $_.FullName
                }
              )

              Write-Host ""
              Write-Host "==========================================" `
                -ForegroundColor Cyan
              Write-Host "VERIFICACION FINAL DEL ZIP" `
                -ForegroundColor Cyan
              Write-Host "==========================================" `
                -ForegroundColor Cyan
              Write-Host ""

              $required = @(
                  "_internal/supabase/",
                  "_internal/postgrest/",
                  "_internal/realtime/",
                  "_internal/storage3/",
                  "_internal/supabase_auth/",
                  "_internal/supabase_functions/",
                  "_internal/pydantic/",
                  "_internal/dotenv/__init__.py",
                  "_internal/certifi/cacert.pem"
              )

              foreach ($requiredPath in $required) {

                  $found = $names |
                    Where-Object {
                      $_ -replace "\\", "/" |
                      ForEach-Object {
                        $_ -like "*$requiredPath*"
                      }
                    } |
                    Select-Object -First 1

                  if ($null -eq $found) {

                      Write-Error `
                        "ERROR CRITICO: falta $requiredPath en update.zip"
                      exit 1
                  }

                  Write-Host `
                    "$requiredPath : OK" `
                    -ForegroundColor Green
              }

              $exeEntry = $names |
                Where-Object {
                  $_ -match "PAPELERA_POS\.exe$"
                } |
                Select-Object -First 1

              $versionEntry = $names |
                Where-Object {
                  $_ -match "version\.txt$"
                } |
                Select-Object -First 1

              if ($null -eq $exeEntry) {

                  Write-Error `
                    "Falta PAPELERA_POS.exe en update.zip"
                  exit 1
              }

              if ($null -eq $versionEntry) {

                  Write-Error `
                    "Falta version.txt en update.zip"
                  exit 1
              }

              $databaseEntry = $names |
                Where-Object {
                  $_ -replace "\\", "/" `
                    -match "(^|/)database/|abril\.db$"
                } |
                Select-Object -First 1

              if ($null -ne $databaseEntry) {

                  Write-Error `
                    "ERROR CRITICO: database/abril.db aparece en update.zip"
                  exit 1
              }

              Write-Host ""
              Write-Host "PAPELERA_POS.exe: OK" `
                -ForegroundColor Green
              Write-Host "version.txt: OK" `
                -ForegroundColor Green
              Write-Host "_internal\supabase: OK" `
                -ForegroundColor Green
              Write-Host "_internal\postgrest: OK" `
                -ForegroundColor Green
              Write-Host "_internal\realtime: OK" `
                -ForegroundColor Green
              Write-Host "_internal\storage3: OK" `
                -ForegroundColor Green
              Write-Host "_internal\supabase_auth: OK" `
                -ForegroundColor Green
              Write-Host "_internal\supabase_functions: OK" `
                -ForegroundColor Green
              Write-Host "_internal\pydantic: OK" `
                -ForegroundColor Green
              Write-Host "_internal\dotenv: OK" `
                -ForegroundColor Green
              Write-Host "_internal\certifi: OK" `
                -ForegroundColor Green
              Write-Host "database: NO incluida" `
                -ForegroundColor Green
              Write-Host "abril.db: NO incluida" `
                -ForegroundColor Green
              Write-Host ""
              Write-Host "ZIP FINAL VERIFICADO CORRECTAMENTE." `
                -ForegroundColor Green
              Write-Host ""
          }
          finally {

              $zip.Dispose()
          }


      # ==================================================
      # SUBIR ARTIFACT
      # ==================================================

      - name: Subir update.zip como artifact
        uses: actions/upload-artifact@v4
        with:
          name: update-${{ github.ref_name }}
          path: update.zip
          if-no-files-found: error


      # ==================================================
      # CREAR RELEASE
      # ==================================================

      - name: Crear Release y subir update.zip
        uses: softprops/action-gh-release@v2
        with:
          files: update.zip
          generate_release_notes: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: Crear Update PAPELERA POS

on:
  push:
    tags:
      - "v*"

jobs:

  build-update:

    runs-on: windows-latest

    steps:

      # ==========================================
      # DESCARGAR REPOSITORIO
      # ==========================================

      - name: Descargar repositorio
        uses: actions/checkout@v4


      # ==========================================
      # INSTALAR PYTHON
      # ==========================================

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================
      # INSTALAR DEPENDENCIAS
      # ==========================================

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ==========================================
      # CREAR EXE
      # ==========================================

      - name: Crear EXE con PyInstaller
        run: |
          pyinstaller --clean PAPELERA_POS.spec


      # ==========================================
      # CREAR VERSION.TXT
      # ==========================================

      - name: Crear version.txt
        shell: powershell
        run: |

          $version = "${{ github.ref_name }}".Replace("v","")

          Write-Host "VERSION:"
          Write-Host $version

          Set-Content `
            -Path "dist\PAPELERA_POS\version.txt" `
            -Value $version `
            -Encoding UTF8


      # ==========================================
      # VERIFICAR ARCHIVOS IMPORTANTES
      # ==========================================

      - name: Verificar build
        shell: powershell
        run: |

          Write-Host "=== CONTENIDO DIST ==="

          Get-ChildItem `
            "dist\PAPELERA_POS" `
            -Recurse


          Write-Host ""
          Write-Host "=== VERSION ==="

          Get-Content `
            "dist\PAPELERA_POS\version.txt"


          Write-Host ""
          Write-Host "=== CERTIFICADO ==="

          if (!(Test-Path `
            "dist\PAPELERA_POS\_internal\certifi\cacert.pem")) {

              Write-Error `
                "ERROR: NO EXISTE certifi\cacert.pem"

              exit 1
          }

          Write-Host `
            "OK: certifi\cacert.pem existe"


      # ==========================================
      # PREPARAR UPDATE
      # ==========================================

      - name: Preparar carpeta Update
        shell: powershell
        run: |

          if (Test-Path "update") {
              Remove-Item `
                "update" `
                -Recurse `
                -Force
          }


          New-Item `
            -ItemType Directory `
            -Path "update"


          # EXE

          Copy-Item `
            "dist\PAPELERA_POS\PAPELERA_POS.exe" `
            "update\PAPELERA_POS.exe" `
            -Force


          # VERSION

          Copy-Item `
            "dist\PAPELERA_POS\version.txt" `
            "update\version.txt" `
            -Force


          # INTERNAL COMPLETO

          Copy-Item `
            "dist\PAPELERA_POS\_internal" `
            "update\_internal" `
            -Recurse `
            -Force


      # ==========================================
      # VERIFICAR UPDATE
      # ==========================================

      - name: Verificar carpeta Update
        shell: powershell
        run: |

          Write-Host "=== UPDATE COMPLETO ==="

          Get-ChildItem `
            "update" `
            -Recurse


          Write-Host ""
          Write-Host "=== VERIFICAR VERSION ==="

          if (!(Test-Path "update\version.txt")) {
              Write-Error "FALTA version.txt"
              exit 1
          }


          Write-Host ""
          Write-Host "=== VERIFICAR CERTIFICADO ==="

          if (!(Test-Path "update\_internal\certifi\cacert.pem")) {

              Write-Error `
                "FALTA update\_internal\certifi\cacert.pem"

              exit 1
          }


          Write-Host `
            "OK: update contiene certifi\cacert.pem"


      # ==========================================
      # CREAR ZIP
      # ==========================================

      - name: Crear update.zip
        shell: powershell
        run: |

          if (Test-Path "update.zip") {
              Remove-Item `
                "update.zip" `
                -Force
          }


          Compress-Archive `
            -Path "update\*" `
            -DestinationPath "update.zip" `
            -CompressionLevel Optimal


      # ==========================================
      # VERIFICAR ZIP
      # ==========================================

      - name: Verificar update.zip
        shell: powershell
        run: |

          Write-Host "=== CONTENIDO DEL ZIP ==="

          tar -tf update.zip


          Write-Host ""
          Write-Host "=== BUSCANDO CERTIFICADO ==="

          $certificado = tar -tf update.zip |
            Select-String "certifi/cacert.pem|certifi\\cacert.pem"


          if (!$certificado) {

              Write-Error `
                "ERROR: update.zip NO contiene certifi\cacert.pem"

              exit 1
          }


          Write-Host `
            "OK: update.zip contiene certifi\cacert.pem"


      # ==========================================
      # SUBIR ARTIFACT
      # ==========================================

      - name: Subir update.zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: update
          path: update.zip


      # ==========================================
      # CREAR RELEASE
      # ==========================================

      - name: Crear Release y subir update.zip
        uses: softprops/action-gh-release@v2

        with:

          files: update.zip

          generate_release_notes: true

        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}